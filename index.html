<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Saintwood | Make your Free Coffee</title>
  <meta name="description" content="Make your free coffee, pick it up opening week. Saintwood — bagels, burgers & coffee, opening soon at 5697 S Jones Blvd, Las Vegas.">
  <meta name="theme-color" content="#fffcf0">
  <meta property="og:title" content="Saintwood | Make your Free Coffee">
  <meta property="og:description" content="Make your free coffee, pick it up opening week.">
  <meta property="og:image" content="https://saintwood-holding.vercel.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A pencil-drawn Saintwood coffee cup and French press: Make your free coffee.">
  <meta property="og:url" content="https://saintwood-holding.vercel.app/">
  <meta property="og:site_name" content="Saintwood">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Saintwood | Make your Free Coffee">
  <meta name="twitter:description" content="Make your free coffee, pick it up opening week.">
  <meta name="twitter:image" content="https://saintwood-holding.vercel.app/assets/og.jpg">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/ovo-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/almarai-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/almarai-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/wordmark.png" as="image" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="modulepreload" href="/js/config.js">
  <link rel="modulepreload" href="/js/sketch.js">
  <link rel="modulepreload" href="/js/art.js">
  <link rel="modulepreload" href="/js/audio.js">
  <link rel="modulepreload" href="/js/scene.js">
  <link rel="modulepreload" href="/js/api.js">
  <link rel="modulepreload" href="/js/flow.js">
  <script type="module" src="/js/main.js"></script>
</head>
<body class="is-loading">
  <canvas id="stage" aria-label="A coffee bench: a cup, a French press, a sleeve and a lid. Pour the coffee, slide on the sleeve and click on the lid." role="img"></canvas>

  <header class="top">
    <a class="brand" href="/" aria-label="Saintwood">
      <span class="wordmark" aria-hidden="true"></span>
      <span class="brand-sub">Bagels &amp; Burgers</span>
    </a>
    <button class="sound" type="button" aria-pressed="true" aria-label="Sound on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/><path class="w1" d="M14.5 9.2a4 4 0 0 1 0 5.6"/><path class="w2" d="M17 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="x" d="M15 9.5l5 5m0-5l-5 5"/></svg>
    </button>
  </header>

  <!-- Bench (the game) -->
  <section class="intro view" data-view="bench" aria-live="polite">
    <h1 class="headline" data-copy="headline"></h1>
    <p class="sub" data-copy="sub"></p>
    <ol class="steps" aria-label="Steps">
      <li data-step="pour"><span class="box" aria-hidden="true"></span><span data-copy="steps.pour"></span></li>
      <li data-step="sleeve"><span class="box" aria-hidden="true"></span><span data-copy="steps.sleeve"></span></li>
      <li data-step="lid"><span class="box" aria-hidden="true"></span><span data-copy="steps.lid"></span></li>
    </ol>
  </section>


  <p class="nudge" role="status" aria-live="polite"></p>
  <p class="peek-note" aria-live="polite"></p>

  <footer class="dock view" data-view="bench">
    <button class="btn btn-primary claim off" type="button" data-copy="claim" aria-disabled="true"></button>
    <div class="aux">
      <button class="link auto" type="button" data-copy="autoplay"></button>
    </div>
  </footer>

  <!-- After signup: the storefront -->
  <section class="final view" data-view="store" hidden>
    <h1 class="headline" data-copy="finalHeadline"></h1>
    <p class="sub final-sub" data-copy="finalSub"></p>
    <div class="final-actions">
      <a class="btn btn-primary ig" target="_blank" rel="noopener" data-href="instagramUrl">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" class="fill"/></svg>
        <span data-copy="igCta"></span>
      </a>
    </div>
    <address class="addr">5697 S Jones Blvd #160 · Las Vegas</address>
  </section>

  <!-- Signup sheet -->
  <div class="scrim" hidden></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <button class="close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="steps-wrap">
        <!-- 1. Question -->
        <form class="step" data-step="q" novalidate>
          <h2 id="sheet-title" class="title" data-copy="q1Title"></h2>
          <div class="choices" role="radiogroup" aria-labelledby="sheet-title"></div>
        </form>

        <!-- 2. Phone -->
        <form class="step" data-step="phone" novalidate hidden>
          <h2 class="title" data-copy="phoneTitle"></h2>
          <p class="lede" data-copy="phoneSub"></p>
          <label class="phone" for="phone">
            <span class="sr-only">Mobile number</span>
            <span class="cc" aria-hidden="true">+1</span>
            <span class="digits" aria-hidden="true"></span>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" enterkeyhint="go" maxlength="17" aria-describedby="phone-err sms-legal" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
          </label>
          <p class="err" id="phone-err" role="alert"></p>
          <input class="hp" type="text" name="sw_hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="legal" id="sms-legal"><span data-copy="smsDisclosure"></span> <a data-href="smsTermsUrl" target="_blank" rel="noopener">SMS Terms</a> · <a data-href="privacyUrl" target="_blank" rel="noopener">Privacy</a></p>
          <button class="btn btn-primary wide send" type="submit" disabled data-copy="phoneCta"></button>
        </form>

        <!-- 3. Email (optional) -->
        <form class="step" data-step="email" novalidate hidden>
          <p class="eyebrow ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-copy="emailEyebrow"></span></p>
          <h2 class="title" data-copy="emailTitle"></h2>
          <p class="lede" data-copy="emailSub"></p>
          <label class="field" for="email">
            <span class="sr-only">Email</span>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="you@email.com">
          </label>
          <button class="btn btn-primary wide add" type="submit" disabled data-copy="emailCta"></button>
          <button class="link skip-email" type="button" data-copy="emailSkip"></button>
        </form>

      </div>
    </div>
  </div>

  <div class="wipe" aria-hidden="true"></div>
  <noscript><p class="noscript">Saintwood — Bagels & Burgers. Opening soon at 5697 S Jones Blvd, Suite 160, Las Vegas. Follow <a href="https://www.instagram.com/saintwoodcafe/">@saintwoodcafe</a>.</p></noscript>
</body>
</html>
